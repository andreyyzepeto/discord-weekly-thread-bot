name: Weekly Discord Thread

on:
  workflow_dispatch:

jobs:
  create-thread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Show project structure
        run: |
          pwd
          ls -la
          cat package.json
