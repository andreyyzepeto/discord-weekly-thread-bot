name: Weekly Discord Thread

on:
  workflow_dispatch:

jobs:
  create-thread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Wait until 09:00 Vietnam time
        shell: bash
        run: |
          TARGET=$(TZ=Asia/Ho_Chi_Minh date -d "today 09:00" +%s)
          NOW=$(date +%s)

          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT_SECONDS=$((TARGET - NOW))
            echo "Waiting $WAIT_SECONDS seconds until 09:00 Vietnam time..."
            sleep "$WAIT_SECONDS"
          else
            echo "It is already past 09:00 Vietnam time. Continuing immediately."
          fi

      - name: Create instance config
        run: |
          mkdir -p instances/instance-1

          cat > instances/instance-1/.env << EOF
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID=${{ secrets.CHANNEL_ID }}
          DAY_OF_WEEK=${{ secrets.DAY_OF_WEEK }}
          HOUR=${{ secrets.HOUR }}
          MINUTE=${{ secrets.MINUTE }}
          TIMEZONE=${{ secrets.TIMEZONE }}
          AUTO_ARCHIVE_DURATION=${{ secrets.AUTO_ARCHIVE_DURATION }}
          RUN_ON_STARTUP=false
          PAUSED=false
          EOF

      - name: Run bot once
        run: npm run create-now -- instance-1
